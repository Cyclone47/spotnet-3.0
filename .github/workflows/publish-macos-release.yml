name: Publish macOS release asset

on:
  push:
    branches:
      - macos-client
    paths-ignore:
      - 'updates/latest-mac.json'
  workflow_dispatch:
    inputs:
      version:
        description: macOS release version
        required: true
        default: 3.0.0.3

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-14
    env:
      VERSION: 3.0.0.3
    steps:
      - name: Checkout macOS client
        uses: actions/checkout@v4
        with:
          ref: macos-client

      - name: Build Intel app bundle
        run: ./tools/make_app_bundle.sh x64

      - name: Package and verify release asset
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent artifacts/Spotnet.app "artifacts/Spotnet-macOS-x64-v${VERSION}.zip"
          shasum -a 256 "artifacts/Spotnet-macOS-x64-v${VERSION}.zip"
          stat -f '%z bytes' "artifacts/Spotnet-macOS-x64-v${VERSION}.zip"

      - name: Ensure Mac release exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "macos-v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "macos-v${VERSION}" --repo "$REPO" --target macos-client \
              --title "Spotnet macOS ${VERSION} (dummy update)" \
              --notes "Dummy macOS update voor het testen van de ingebouwde updater."
          fi

      - name: Upload asset to existing Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "macos-v${VERSION}" \
            "artifacts/Spotnet-macOS-x64-v${VERSION}.zip" \
            --repo "$REPO" \
            --clobber

      - name: Update latest-mac.json and commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ZIP="artifacts/Spotnet-macOS-x64-v${VERSION}.zip"
          SIZE=$(stat -f '%z' "$ZIP")
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "Asset size: $SIZE, sha256: $SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 -c "import json; p='updates/latest-mac.json'; d=json.load(open(p)); d['macSize']=int('$SIZE'); d['macSha256']='$SHA'; json.dump(d,open(p,'w'),indent=2); open(p,'a').write('\n')"
          git add updates/latest-mac.json
          git commit -m "Auto-update latest-mac.json voor v${VERSION} [skip ci]" || echo "No changes"
          git push origin macos-client
