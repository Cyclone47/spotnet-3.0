name: Publish macOS release asset

on:
  push:
    branches:
      - macos-client
  workflow_dispatch:
    inputs:
      version:
        description: macOS release version
        required: true
        default: 3.0.0.3

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-14
    env:
      VERSION: 3.0.0.3
    steps:
      - name: Checkout macOS client
        uses: actions/checkout@v4
        with:
          ref: macos-client

      - name: Build Intel app bundle
        run: ./tools/make_app_bundle.sh x64

      - name: Package and verify release asset
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent artifacts/Spotnet.app "artifacts/Spotnet-macOS-x64-v${VERSION}.zip"
          shasum -a 256 "artifacts/Spotnet-macOS-x64-v${VERSION}.zip"
          stat -f '%z bytes' "artifacts/Spotnet-macOS-x64-v${VERSION}.zip"

      - name: Ensure Mac release exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "macos-v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "macos-v${VERSION}" --repo "$REPO" --target macos-client \
              --title "Spotnet macOS ${VERSION} (dummy update)" \
              --notes "Dummy macOS update voor het testen van de ingebouwde updater."
          fi

      - name: Upload asset to existing Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "macos-v${VERSION}" \
            "artifacts/Spotnet-macOS-x64-v${VERSION}.zip" \
            --repo "$REPO" \
            --clobber
