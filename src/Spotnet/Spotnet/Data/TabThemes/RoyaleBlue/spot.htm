 // Hans Pufal's pad-number
 function pad(n, len, padding) {
    var sign = '',
       s = n;
    if (typeof n === 'number') {
       sign = n < 0 ? '-' : '';
       s = Math.abs(n).toString();
    }
    if ((len -= s.length) > 0) s = Array(len + 1).join(padding || '0') +
       s;
    return sign + s;
 }

 // [SN:STAMP]
 function convertTimestamp() {
    var timestampValue = ('[SN:STAMP]');
    var dt = new Date(timestampValue * 1000);
    document.getElementById('datum').innerHTML = pad(dt.getDate(), 2) + '-' + pad(dt.getMonth() + 1, 2) + '-' + dt.getFullYear() + ' ' + '(' + pad(dt.getHours(), 2) + ':' + pad(dt.getMinutes(), 2) + ')';
 };

 // ************* SpotTrailer by Wheaten ****************
 //Make first Letter uppercase
 function toProperCase(s) {
    return s.toLowerCase().replace(/^(.)|\s(.)/g, function($1) {
       return $1.toUpperCase();
    });
 };

 //Clean string make a check for date format
 function toCleanString(string) {
    //Remove all special characters
    string = string.replace(/\./g, ' ');
    string = string.replace(/\_/g, ' ');
    string = string.replace(/\`/g, '');
    string = string.replace(/\'/g, '');
    string = string.replace(/\-/g, ' ');
    //Check if there is a date format, without ()
    var year = string.match(/\d{4}(?!p)/);
    var pos = string.search(year);
    //if date get leftstring
    if (pos > 0) {
       var partname = string.substr(0, pos - 1);
       string = partname.replace(/\s+/, ' ');
    }
    //Strip all season related stuff
    string = regexstr(string);
    // string = cleanup(string);
    //Get proper case
    string = toProperCase(string);
    //Remove HTML entity tags like #123;
    // string = html_entity_decode(string);
	   string = htmlDecode(string);
    //Some cases a \s{2} is left, so remove it.
    string = string.replace(/\s+/g, ' ');
    //Give result back
    if (pos > 0) {
       return string = string.replace(/^\s+|\s+$/g, '') + ' (' + year + ')';
    } else {
       return string = string.replace(/^\s+|\s+$/g, '');
    };
 };

 //Locate year as (2012), remove everything behind. return string
 function escapeRegExp(string, cat) {
    if (cat == 'Films' || cat == 'Series') {
       var year = string.match(/\(\d{4}\)/);
       //Find pos of year
       var pos = string.search(year);
       if (pos > 0) {
          //get part before year
          var partname = string.substr(0, pos - 1);
          //remove multiple spaces and replace it by 1, add year behind it.
          partname = partname.replace(/\s+/, ' ');
          partname = toCleanString(partname) + ' ' + year;
          partname = partname.replace(/\s+/g, ' ');
          return partname;
       } else {
          string = toCleanString(string);
          return string;
       }
    } else
       return string;
 };

 //regex for movie
 function regexstr(string) {
    return string.replace(/(\*seizoens finale\*)*(seizoen\s*[0-9]*)*(season\s*[0-9]*)*(aflevering\s*[0-9]*)*(5.1)*(episode\s*[0-9]*)*(deel\s*[0-9]*)*(S\e*[0-9]{1,2}\s*E*D*[0-9]{1,2})*(\([a-zA-Z]+\))*(\([a-zA-Z]+\))*(\([\d*\s*]*\))*(\w*DVD\w*\s*\d*)*(ondertitel\w*\s*\:*)*(mkg)*(custom)*((bd)?remux)*(ntsc)*(pal)*(2d)*(3d)*(AC3)*(avchd)*(webrip)*(web)*(dl)*(hq)*(dts)*(\stv)*(\sdd)*(pdtv)*(ifh)*(\sx\s*264-\w*\s*)*(\sh\s*264-\w*\s*)*(\sx\s*264)*(\sh\s*264)*(\(*\)*)*(\(*\)*)*(immerse)*(huur)*(koop)*(\(*\s*\**\s*repost\s*\**\s*\)*)*(retail)*(rebuild)*(\(*\s*extended\s*\w*\s*\)*)*(\[.*\])*(\w*DVD\`*\'*\w*\s*\d*)*(disc\`*\'*\w*\s:*\s*\d*\s*\\*\/*\s*\d*)*(\w*xvid\w*)*(\w*divx\w*)*(-=?.{0,10}=?-)*(\**\(*\d{3,4}p\)*\**)*(\**\(*\d{3,4}i\)*\**)*(\s+\d*HD\w*)*(mkv)*(blu\e*ray)*([Ss][Uu][Bb][Ss]\s*[Mm][Aa][\Dd][Ee]\s*[Bb][Yy]\:*\s*)*(n*l*subs)*([.~*]*\s*[SRT]+\s*[*~.]+)*(\sdutch\s)*(\s+nederlands)*(\s+engels)*(\s+eng\s)*(\s+eng\\)*(\ssubbed\s)*(\snl)*/ig, '');
 }

 // regex for Search
 function CleanSearch() {
    var title = GetCleantitle();
    var reg = /(\(?\s?\*?\s?\-?\s?\[?\s?\d{4}\s?\]?\s?\-?\s?\*?\s?\)?)*(\(*\d*CD\)*)*(repost\s?)*(MP3)*(DTS)*(promo)*(cdr)*(\/)*(ps3)*(sacd)*(\d{2}\s*bits?)*(\d*\.?\d*\s*khz)*(DVD\-* a*)*(flac)*(lossless)*(\d{1}ch)*(\(*\s*\[*\s*\d{2}\s*bits?\s*\-*\s*\/*\s*\\*\s*\d*\.?\d*\s*khz\s*\)*\s*\]*)*(\{.*\})*(\[.*\])*(tushengpeng)*(eac)*(ogg)*(wav)*(vbr)*(sat)*(rip)*(verzoek|je)*([\])}[{(])?/ig;
    var spottitle = title.replace(reg, "");
    var re = new RegExp("\\s+", 'g'); // \s means white space (the extra \ is an escape), g means global
    return spottitle.replace(re, "%20");
 };

function doPreview(CommentBody, CommentPreview)
{
	var sourceValue = document.getElementById('CommentBody').value;
	var reNewLines=/[\n]/g;
	var dest = document.getElementById('CommentPreview');
	
	//if (sourceValue.length > 0)
	//{
		//dest.style.display = 'block';
	//}
	//else
	//{
		//dest.style.display = 'none';
	//}
	
	search = new Array(
			/\[br\]/gi,
			/\[(\/)?(b|i|u|s)\]/gi,
			/\[quote="*(.+?)"*\]/gi,
			/\[\/quote\]/gi,
			/(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gi,
			/\[url]<a.+?link:(.+?)".+?\[\/url]/gi, 				// [url]http://xxx[/url] met http erin omgezet door linkify
			/\[url=(?:")?<a.+?link:(.+?)".+?](.+?)\[\/url]/gi,	// [url=http://xxx]yyy[/url] met http erin omgezet door linkify evt met &quot;
			/\[url=(?:")?(.+?)(?:")?](.+?)\[\/url]/gi, 			// [url="xxx"]yyy[/url] without or with quotes but not linkified
			/\[url](.+?)\[\/url]/gi, 							// [url]xxx[/url] without or with quotes but not linkified
			/\[img=(.+?)\]/gi,
			/\[color="?(#?[a-z0-9]+)"?\](.*?)\[\/color]/gi
			);

	replace = new Array(
			'<br>',
			'<$1$2>',
			'<blockquote><div><cite>$1 schreef:</cite></div>',
			'</blockquote>',
			'<a href="link:$1">$1</a>',
			'<a href="link:$1" title="$1">$1</a>', 	// [url]http://xxx[/url] met http erin omgezet door linkify
			'<a href="link:$1" title="$1">$2</a>', 	// [url=http://xxx]yyy[/url] met http erin omgezet door linkify evt met &quot;
			'<a href="link:$1" title="$1">$2</a>', 	// [url="xxx"]yyy[/url] without or with quotes but not linkified
			'<a href="link:$1" title="$1">$1</a>', 	// [url]xxx[/url] without or with quotes but not linkified
			'<img src="[SN:SMILEYS]/$1.gif">',
			'<font color="$1">$2</font>'
			);

	for(i = 0; i < search.length; i++)
	{
	     sourceValue = sourceValue.replace(search[i], replace[i]);
	}

	dest.innerHTML = sourceValue.replace(reNewLines, "<br>");
	
}

function detectIE() {
    var ua = window.navigator.userAgent;
    var msie = ua.indexOf('MSIE ');
    if (msie > 0) {
        // IE 10 or older => return version number
        return parseInt(ua.substring(msie + 5, ua.indexOf('.', msie)), 10);
    }
    var trident = ua.indexOf('Trident/');
    if (trident > 0) {
        // IE 11 => return version number
        var rv = ua.indexOf('rv:');
        return parseInt(ua.substring(rv + 3, ua.indexOf('.', rv)), 10);
    }
    var edge = ua.indexOf('Edge/');
    if (edge > 0) {
        // Edge (IE 12+) => return version number
        return parseInt(ua.substring(edge + 5, ua.indexOf('.', edge)), 10);
    }
    // other browser
    return false;
}

          p.sld.style.height = jscolor.images.sld[1] + 'px';

          // slider border
          p.sldB.style.display = THIS.slider ? 'block' : 'none';
          p.sldB.style.position = 'absolute';
          p.sldB.style.right = THIS.pickerFace + 'px';
          p.sldB.style.top = THIS.pickerFace + 'px';
          p.sldB.style.border = THIS.pickerInset + 'px solid';
          p.sldB.style.borderColor = THIS.pickerInsetColor;

          // slider mouse area
          p.sldM.style.display = THIS.slider ? 'block' : 'none';
          p.sldM.style.position = 'absolute';
          p.sldM.style.right = '0';
          p.sldM.style.top = '0';
          p.sldM.style.width = jscolor.images.sld[0] + jscolor.images.arrow[0] + THIS.pickerFace + 2 * THIS.pickerInset + 'px';
          p.sldM.style.height = p.box.style.height;
          try {
             p.sldM.style.cursor = 'pointer';
          } catch (eOldIE) {
             p.sldM.style.cursor = 'hand';
          }

          // "close" button
          function setBtnBorder() {
             var insetColors = THIS.pickerInsetColor.split(/\s+/);
             var pickerOutsetColor = insetColors.length < 2 ? insetColors[0] : insetColors[1] + ' ' + insetColors[0] + ' ' + insetColors[0] + ' ' + insetColors[1];
             p.btn.style.borderColor = pickerOutsetColor;
          }
          p.btn.style.display = THIS.pickerClosable ? 'block' : 'none';
          p.btn.style.position = 'absolute';
          p.btn.style.left = THIS.pickerFace + 'px';
          p.btn.style.bottom = THIS.pickerFace + 'px';
          p.btn.style.padding = '0 15px';
          p.btn.style.height = '18px';
          p.btn.style.border = THIS.pickerInset + 'px solid';
          setBtnBorder();
          p.btn.style.color = THIS.pickerButtonColor;
          p.btn.style.font = '12px sans-serif';
          p.btn.style.textAlign = 'center';
          try {
             p.btn.style.cursor = 'pointer';
          } catch (eOldIE) {
             p.btn.style.cursor = 'hand';
          }
          p.btn.onmousedown = function() {
             THIS.hidePicker();
          };
          p.btnS.style.lineHeight = p.btn.style.height;

          // load images in optimal order
          switch (modeID) {
             case 0:
                var padImg = 'hs.png';
                break;
             case 1:
                var padImg = 'hv.png';
                break;
          }
          p.padM.style.backgroundImage = "url('" + jscolor.getDir() + "cross.gif')";
          p.padM.style.backgroundRepeat = "no-repeat";
          p.sldM.style.backgroundImage = "url('" + jscolor.getDir() + "arrow.gif')";
          p.sldM.style.backgroundRepeat = "no-repeat";
          p.pad.style.backgroundImage = "url('" + jscolor.getDir() + padImg + "')";
          p.pad.style.backgroundRepeat = "no-repeat";
          p.pad.style.backgroundPosition = "0 0";

          // place pointers
          redrawPad();
          redrawSld();

          jscolor.picker.owner = THIS;
          document.getElementsByTagName('body')[0].appendChild(p.boxB);
       }


       function getPickerDims(o) {
          var dims = [
             2 * o.pickerInset + 2 * o.pickerFace + jscolor.images.pad[0] +
             (o.slider ? 2 * o.pickerInset + 2 * jscolor.images.arrow[0] + jscolor.images.sld[0] : 0),
             o.pickerClosable ?
             4 * o.pickerInset + 3 * o.pickerFace + jscolor.images.pad[1] + o.pickerButtonHeight :
             2 * o.pickerInset + 2 * o.pickerFace + jscolor.images.pad[1]
          ];
          return dims;
       }


       function redrawPad() {
          // redraw the pad pointer
          switch (modeID) {
             case 0:
                var yComponent = 1;
                break;
             case 1:
                var yComponent = 2;
                break;
          }
          var x = Math.round((THIS.hsv[0] / 6) * (jscolor.images.pad[0] - 1));
          var y = Math.round((1 - THIS.hsv[yComponent]) * (jscolor.images.pad[1] - 1));
          jscolor.picker.padM.style.backgroundPosition =
             (THIS.pickerFace + THIS.pickerInset + x - Math.floor(jscolor.images.cross[0] / 2)) + 'px ' +
             (THIS.pickerFace + THIS.pickerInset + y - Math.floor(jscolor.images.cross[1] / 2)) + 'px';

          // redraw the slider image
          var seg = jscolor.picker.sld.childNodes;

          switch (modeID) {
             case 0:
                var rgb = HSV_RGB(THIS.hsv[0], THIS.hsv[1], 1);
                for (var i = 0; i < seg.length; i += 1) {
                   seg[i].style.backgroundColor = 'rgb(' +
                      (rgb[0] * (1 - i / seg.length) * 100) + '%,' +
                      (rgb[1] * (1 - i / seg.length) * 100) + '%,' +
                      (rgb[2] * (1 - i / seg.length) * 100) + '%)';
                }
                break;
             case 1:
                var rgb, s, c = [THIS.hsv[2], 0, 0];
                var i = Math.floor(THIS.hsv[0]);
                var f = i % 2 ? THIS.hsv[0] - i : 1 - (THIS.hsv[0] - i);
                switch (i) {
                   case 6:
                   case 0:
                      rgb = [0, 1, 2];
                      break;
                   case 1:
                      rgb = [1, 0, 2];
                      break;
                   case 2:
                      rgb = [2, 0, 1];
                      break;
                   case 3:
                      rgb = [2, 1, 0];
                      break;
                   case 4:
                      rgb = [1, 2, 0];
                      break;
                   case 5:
                      rgb = [0, 2, 1];
                      break;
                }
                for (var i = 0; i < seg.length; i += 1) {
                   s = 1 - 1 / (seg.length - 1) * i;
                   c[1] = c[0] * (1 - s * f);
                   c[2] = c[0] * (1 - s);
                   seg[i].style.backgroundColor = 'rgb(' +
                      (c[rgb[0]] * 100) + '%,' +
                      (c[rgb[1]] * 100) + '%,' +
                      (c[rgb[2]] * 100) + '%)';
                }
                break;
          }
       }


       function redrawSld() {
          // redraw the slider pointer
          switch (modeID) {
             case 0:
                var yComponent = 2;
                break;
             case 1:
                var yComponent = 1;
                break;
          }
          var y = Math.round((1 - THIS.hsv[yComponent]) * (jscolor.images.sld[1] - 1));
          jscolor.picker.sldM.style.backgroundPosition =
             '0 ' + (THIS.pickerFace + THIS.pickerInset + y - Math.floor(jscolor.images.arrow[1] / 2)) + 'px';
       }


       function isPickerOwner() {
          return jscolor.picker && jscolor.picker.owner === THIS;
       }


       function blurTarget() {
          if (valueElement === target) {
             THIS.importColor();
          }
          if (THIS.pickerOnfocus) {
             THIS.hidePicker();
          }
       }


       function blurValue() {
          if (valueElement !== target) {
             THIS.importColor();
          }
       }


       function setPad(e) {
          var mpos = jscolor.getRelMousePos(e);
          var x = mpos.x - THIS.pickerFace - THIS.pickerInset;
          var y = mpos.y - THIS.pickerFace - THIS.pickerInset;
          switch (modeID) {
             case 0:
                THIS.fromHSV(x * (6 / (jscolor.images.pad[0] - 1)), 1 - y / (jscolor.images.pad[1] - 1), null, leaveSld);
                break;
             case 1:
                THIS.fromHSV(x * (6 / (jscolor.images.pad[0] - 1)), null, 1 - y / (jscolor.images.pad[1] - 1), leaveSld);
                break;
          }
       }


       function setSld(e) {
          var mpos = jscolor.getRelMousePos(e);
          var y = mpos.y - THIS.pickerFace - THIS.pickerInset;
          switch (modeID) {
             case 0:
                THIS.fromHSV(null, null, 1 - y / (jscolor.images.sld[1] - 1), leavePad);
                break;
             case 1:
                THIS.fromHSV(null, 1 - y / (jscolor.images.sld[1] - 1), null, leavePad);
                break;
          }
       }


       function dispatchImmediateChange() {
          if (THIS.onImmediateChange) {
             var callback;
             if (typeof THIS.onImmediateChange === 'string') {
                callback = new Function(THIS.onImmediateChange);
             } else {
                callback = THIS.onImmediateChange;
             }
             callback.call(THIS);
          }
       }


       var THIS = this;
       var modeID = this.pickerMode.toLowerCase() === 'hvs' ? 1 : 0;
       var abortBlur = false;
       var
          valueElement = jscolor.fetchElement(this.valueElement),
          styleElement = jscolor.fetchElement(this.styleElement);
       var
          holdPad = false,
          holdSld = false,
          touchOffset = {};
       var
          leaveValue = 1 << 0,
          leaveStyle = 1 << 1,
          leavePad = 1 << 2,
          leaveSld = 1 << 3;

       jscolor.isColorAttrSupported = false;
       var el = document.createElement('input');
       if (el.setAttribute) {
          el.setAttribute('type', 'color');
          if (el.type.toLowerCase() == 'color') {
             jscolor.isColorAttrSupported = true;
          }
       }

       // target
       jscolor.addEvent(target, 'focus', function() {
          if (THIS.pickerOnfocus) {
             THIS.showPicker();
          }
       });
       jscolor.addEvent(target, 'blur', function() {
          if (!abortBlur) {
             window.setTimeout(function() {
                abortBlur || blurTarget();
                abortBlur = false;
             }, 0);
          } else {
             abortBlur = false;
          }
       });

       // valueElement
       if (valueElement) {
          var updateField = function() {
             THIS.fromString(valueElement.value, leaveValue);
             dispatchImmediateChange();
          };
          jscolor.addEvent(valueElement, 'keyup', updateField);
          jscolor.addEvent(valueElement, 'input', updateField);
          jscolor.addEvent(valueElement, 'blur', blurValue);
          valueElement.setAttribute('autocomplete', 'off');
       }

       // styleElement
       if (styleElement) {
          styleElement.jscStyle = {
             backgroundImage: styleElement.style.backgroundImage,
             backgroundColor: styleElement.style.backgroundColor,
             color: styleElement.style.color
          };
       }

       // require images
       switch (modeID) {
          case 0:
             jscolor.requireImage('hs.png');
             break;
          case 1:
             jscolor.requireImage('hv.png');
             break;
       }
       jscolor.requireImage('cross.gif');
       jscolor.requireImage('arrow.gif');

       this.importColor();
    }

 };


 jscolor.install();

  </script>
