<!--

    [FROM] = Afzender
    [TAG] = Tag
    [STAMP] = Datum
    [CAT] = Categorie
    [WEB] = Weblink
    [SUBCATS] = Subcats
    [DESC] = Beschrijving
    [UNIQUE] = Unique ID

    [PATH] = Installatie map
    [FONTSIZE] = Lettergrootte
//-->

  <style type="text/css">
/* Spotnet styles */
html {
  font: [SN:FONTEM] Verdana;
  padding: 0 0.6em 0 0;
}
body {
  overflow: auto;
  overflow-x: hidden;
}
input, textarea {
  font: inherit;
}
a {
  display: inline-block;
  overflow: hidden;
  word-wrap: break-word;
  word-break: break-all;
  vertical-align: top;
}
ul {
  list-style-type: square;
  overflow: hidden;
}
ol.oltype1 {
  list-style-type: decimal;
  overflow: hidden;
}
ol.oltypea {
  list-style-type: lower-alpha;
  overflow: hidden;
}
/* reacties */
.cm-header {
  min-height: 19px;
  background: #F2F5F8;
  background-image: -ms-linear-gradient(top, #F2F5F8, #C5D0DF);
  background-image: linear-gradient(to bottom, #F2F5F8, #C5D0DF);
  border-top: solid 1px #AFC0D3;
  border-bottom: solid 1px #C1CDDD;
  padding: 0px 6px 0px 6px;
}
.cm-dc {
  display: inline-block;
  width: 90%;
  min-height: 23px;
  padding: 6px 0px 6px 6px;
/* top - right - bottom - left */
}
span.avatar img {
  float: right;
  width: 32px;
  height: 32px;
  vertical-align: top;
/* 4px left voor blockquotes */
}
/* blacklist icon */
#black {
  display: inline-block;
  width: 14px!important;
  height: 14px!important;
}
.from {
  color: #000000;
  font-weight: bold;
  text-decoration: none;
}
.from:hover {
  color: #800000;
}
.category {
  color: #000000;
  text-decoration: none;
}
.category:hover {
  color: #0000FF;
}
.date {
  color: #585858;
  font-size: 90%;
  float: right;
}
.comment {
  color: #585858;
  text-decoration: none;
}
.comment:hover {
  color: #000000;
  font-weight: bold;
}
.author {
  color: #800000;
  font-weight: bold;
  text-decoration: none;
}
.author:hover {
  color: #FF0000;
  font-weight: bold;
  text-decoration: none;
}
.author_trusted {  
  background: url('[SN:THEME]/img/accept.png') no-repeat 0 2px;
  color: #800000;
  font-weight: bold;
  text-decoration: none;
  padding-left:20px;
}
.author_trusted:hover {
  color: #FF0000;
  font-weight: bold;
  text-decoration: none;
}
/* eigen ID */
.own {
  color: #00007F!important;
  font-weight: bold;
  text-decoration: none;
}
.own:hover {
  color: #0000ff!important;
  font-weight: bold;
  text-decoration: none;
}
/* eigen ID + whitelisted */
.own_trusted {
  background: url('[SN:THEME]/img/accept.png') no-repeat 0 2px;
  color: #00007F!important;
  font-weight: bold;
  text-decoration: none;
  padding-left: 20px;
}
.own_trusted:hover {
  background: url('[SN:THEME]/img/accept.png') no-repeat 0 2px;
  color: #0000ff!important;
  font-weight: bold;
  text-decoration: none;
}
.trusted {
  color: #006600;
  font-weight: bold;
  text-decoration: none;
}
.trusted:hover {
  color: #008000;
  font-weight: bold;
  text-decoration: none;
}
.untrusted {
  color: #C8C8C8;
  text-decoration: line-through;
}
.untrusted:hover {
  color: #C8C8C8;
}
.img_box {
  clear: both;
  float: left;
  max-width: 350px;
}
.img_box:hover {
  max-width: 100%;
}
/* Spot Image */
#SpotImage {
  max-width: 350px;
  margin: 0 25px 5px 0;
  border: none;
  outline: none;
}
#SpotImage:hover {
  max-width: 98%;
}
#Description {
  overflow: hidden;
  text-align: justify;
  vertical-align: top;
  word-wrap: break-word;
}
#Information, #Comments {
  overflow: hidden;
  vertical-align: top;
  word-wrap: break-word;
}
/* padding for images & smileys */
#Comments img, #Description img {
  padding: 1px 3px 0 3px;
}
/* BBEditor class styles */
.toolbar {
  width: 100%;
}
.button {
  border: 1px solid #ccc;
  margin: 1px;
  padding: 2px;
}
.button:hover, .lighten_btn:hover {
  cursor: pointer;
  opacity: 0.6;
  -moz-opacity: 0.6;
  -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=60)";
  filter: alpha(opacity =60);
}
.ed {
  width: 100%;
  height: 150px;
}
.spacer {
  display: inline-block;
  width: 22px;
  height: 22px;
  cursor: default;
  margin: 1px;
  padding-bottom: 3px;
}
/* Improver styles */
blockquote{
  font-style: italic;
  background: #f4f4ef url('[SN:THEME]/img/squote.gif') no-repeat 6px 6px;
  border: 1px solid #dbdbdb;
  margin: 0 1px 0 25px;
  overflow: hidden;
  padding: 5px;
}
blockquote blockquote {
  background-color: #f7f7f2;
  margin: 0.5em 1px 0 15px;
}
blockquote cite{
  margin-left: 20px;
  font-style: normal;
  font-weight: bold;
  font-size: 0.9em;
}
span#extra img{
  vertical-align: middle;
}
span#extra{
  margin-bottom: 4px;
  display: block;
}
.reply_img, .reply_img a:link {
  cursor: hand !important;
  float: right;
  position: relative;
  display: block;
  width: 32px;
  height: 26px;
  background: url('[SN:THEME]/img/reply.png') no-repeat 0 2px;
  text-decoration: none;
  margin: 0 7px 10px 0;
  border: none;
  outline: 0;
}
.reply_img:hover {
  background: url('[SN:THEME]/img/reply.png') no-repeat 0 -25px;
}
/* Nav bar -> future use for text */

/* Nav Div */
#navdiv {
  font: 14px/16px Verdana, Helvetica, sans-serif;
  width: auto;
  position: relative;
  padding: 1px 16px 1px 4px;
}
#navImg {
  float: right;
  margin: 0 30px 20px 0;
  padding: 0;
  height: 1.7em;
}
#navImg li {
  float: left;
  list-style: none;
}
/* Report SPAM MELDEN enz. */
#ReportButton {
  display: block;
  width: 16px;
  height: 16px;
  background: url('[SN:THEME]/img/warning.png') no-repeat 0 0;
  margin: 0 2px 0 3px;
  text-decoration: none;
  border: none;
  outline: 0;
}
#ReportButton:hover {
  cursor: pointer;
  display: block;
  width: 16px;
  height: 16px;
  background: url('[SN:THEME]/img/warning2.png') no-repeat 0 0;
  margin: 0 2px 0 3px;
  text-decoration: none;
  border: none;
  outline: 0;
}
/* Favorieten  */
.favadd {
  display: block;
  width: 16px;
  height: 16px;
  background: url('[SN:THEME]/img/fav_add.png') no-repeat 0 0;
  text-decoration: none;
  border: none;
  margin: 0 3px 0 3px;
  outline: 0;
}
.favadd:hover {
  display: block;
  width: 16px;
  height: 16px;
  background: url('[SN:THEME]/img/fav_add2.png') no-repeat 0 0;
  margin: 0 3px 0 3px;
  text-decoration: none;
  border: none;
  outline: 0;
}
.favdel {
  display: block;
  width: 16px;
  height: 16px;
  background: url('[SN:THEME]/img/fav.png') no-repeat 0 0;
  margin: 0 3px 0 3px;
  text-decoration: none;
  border: none;
  outline: 0;
}
.favdel:hover {
  cursor: pointer;
  display: block;
  width: 16px;
  height: 16px;
  background: url('[SN:THEME]/img/fav_del.png') no-repeat 0 0;
  margin: 0 3px 0 3px;
  text-decoration: none;
  border: none;
  outline: 0;
}
/* navImg  sprite */
.NZBinfo, #weburl {
  position: relative;
  display: inline-block;
  width: 16px;
  height: 16px;
  background: url('[SN:THEME]/img/copy-sprite.png');
  margin: 0 3px 0 3px;
  border: none;
  outline: 0;
}
/* NZB info */
.NZBinfo {
  cursor: pointer;
  background-position: -64px 0px;
}
.NZBinfo:hover {
  background-position: -64px -16px;
}
/* Web url */
#weburl {
  cursor: pointer;
  background-position: -80px 0px;
}
#weburl:hover {
  background-position: -80px -16px;
}
</style> 

<title>[SN:TITLE]</title>
