	URI : function(uri) { // See RFC3986

		this.scheme = null;
		this.authority = null;
		this.path = '';
		this.query = null;
		this.fragment = null;

			var m = uri.match(/^(([A-Za-z][0-9A-Za-z+.-]*)(:))?((\/\/)([^\/?#]*))?([^?#]*)((\?)([^#]*))?((#)(.*))?/);

			this.authority = m[5] ? m[6] : null;
			this.path = m[7];
			this.query = m[9] ? m[10] : null;
			this.fragment = m[12] ? m[13] : null;
			return this;
		};

		this.toString = function() {
			var result = '';
			if(this.scheme !== null) { result = result + this.scheme + ':'; }
			if(this.authority !== null) { result = result + '//' + this.authority; }
			if(this.path !== null) { result = result + this.path; }
			if(this.query !== null) { result = result + '?' + this.query; }
			if(this.fragment !== null) { result = result + '#' + this.fragment; }
			return result;
		};

			var base = new jscolor.URI(base);

			var t = new jscolor.URI;

			if(base.scheme === null) { return false; }

			if(r.scheme !== null && r.scheme.toLowerCase() === base.scheme.toLowerCase()) {
				r.scheme = null;
			}

			if(r.scheme !== null) {
				t.scheme = r.scheme;
				t.authority = r.authority;
				t.path = removeDotSegments(r.path);
				t.query = r.query;
			} else {
				if(r.authority !== null) {
					t.authority = r.authority;
					t.path = removeDotSegments(r.path);
					t.query = r.query;
				} else {
					if(r.path === '') {
						t.path = base.path;
						if(r.query !== null) {
							t.query = r.query;
						} else {
							t.query = base.query;
						}
					} else {
						if(r.path.substr(0,1) === '/') {
							t.path = removeDotSegments(r.path);
						} else {
							if(base.authority !== null && base.path === '') {
								t.path = '/'+r.path;
							} else {
								t.path = base.path.replace(/[^\/]+$/,'')+r.path;
							}
							t.path = removeDotSegments(t.path);
						}
						t.query = r.query;
					}
					t.authority = base.authority;
				}
				t.scheme = base.scheme;
			}
			t.fragment = r.fragment;

			return t;
		};

		function removeDotSegments(path) {
			var out = '';
			while(path) {
				if(path.substr(0,3)==='../' || path.substr(0,2)==='./') {
					path = path.replace(/^\.+/,'').substr(1);
				} else if(path.substr(0,3)==='/./' || path==='/.') {
					path = '/'+path.substr(3);
				} else if(path.substr(0,4)==='/../' || path==='/..') {
					path = '/'+path.substr(4);
					out = out.replace(/\/?[^\/]*$/, '');
				} else if(path==='.' || path==='..') {
					path = '';
				} else {
					var rm = path.match(/^\/?[^\/]*/)[0];
					path = path.substr(rm.length);
					out = out + rm;
				}
			}
			return out;
		}

		if(uri) {
			this.parse(uri);
		}

			var x = Math.round((THIS.hsv[0]/6) * (jscolor.images.pad[0]-1));

				(THIS.pickerFace+THIS.pickerInset+x - Math.floor(jscolor.images.cross[0]/2)) + 'px ' +

			switch(modeID) {
				case 0:
					var rgb = HSV_RGB(THIS.hsv[0], THIS.hsv[1], 1);
					for(var i=0; i<seg.length; i+=1) {
						seg[i].style.backgroundColor = 'rgb('+
							(rgb[0]*(1-i/seg.length)*100)+'%,'+
							(rgb[1]*(1-i/seg.length)*100)+'%,'+
							(rgb[2]*(1-i/seg.length)*100)+'%)';
					}
					break;
				case 1:
					var rgb, s, c = [ THIS.hsv[2], 0, 0 ];
					var i = Math.floor(THIS.hsv[0]);
					var f = i%2 ? THIS.hsv[0]-i : 1-(THIS.hsv[0]-i);
					switch(i) {
						case 6:
						case 0: rgb=[0,1,2]; break;
						case 1: rgb=[1,0,2]; break;
						case 2: rgb=[2,0,1]; break;
						case 3: rgb=[2,1,0]; break;
						case 4: rgb=[1,2,0]; break;
						case 5: rgb=[0,2,1]; break;
					}
					for(var i=0; i<seg.length; i+=1) {
						s = 1 - 1/(seg.length-1)*i;
						c[1] = c[0] * (1 - s*f);
						c[2] = c[0] * (1 - s);
						seg[i].style.backgroundColor = 'rgb('+
							(c[rgb[0]]*100)+'%,'+
							(c[rgb[1]]*100)+'%,'+
							(c[rgb[2]]*100)+'%)';
					}
					break;

                os = 'winxp';
        } // xp
        else if (navigator.userAgent.indexOf("NT 6.1") != -1) {
                os = 'win7';

        }
        return os;

function doImage(obj) {
        textarea = document.getElementById(obj);
        var url = prompt('Enter the Image URL:', 'http://');
        var scrollTop = textarea.scrollTop;
        var scrollLeft = textarea.scrollLeft;
        if (url != '' && url != null) {
                if (document.selection) // IE < 11
                {
                        textarea.focus();
                        var sel = document.selection.createRange();
                        sel.text = '[img]' + url + '[/img]';
                } else { // IE > 10
                        var len = textarea.value.length;
                        var start = textarea.selectionStart;
                        var end = textarea.selectionEnd;
                        var rep = '[img]' + url + '[/img]';
                        textarea.value = textarea.value.substring(0, start) + rep + textarea.value.substring(end, len);
                        textarea.selectionStart = start + rep.length;
                        textarea.selectionEnd = textarea.selectionStart;
                        setTimeout(function() {
                                textarea.focus();
                        }, 50);
                }
        }
}

function doURL(obj) {
        textarea = document.getElementById(obj);
        var url = prompt('Enter the URL:', 'http://');
        var scrollTop = textarea.scrollTop;
        var scrollLeft = textarea.scrollLeft;
        if (url != '' && url != null) {
                if (document.selection) {
                        textarea.focus();
                        var sel = document.selection.createRange();
                        if (sel.text == "") {
                                sel.text = '[url]' + url + '[/url]';
                        } else {
                                sel.text = '[url="' + url + '"]' + sel.text + '[/url]';
                        }
                } else {
                        var len = textarea.value.length;
                        var start = textarea.selectionStart;
                        var end = textarea.selectionEnd;

function detectIE() {
    var ua = window.navigator.userAgent;
    var msie = ua.indexOf('MSIE ');
    if (msie > 0) {
        // IE 10 or older => return version number
        return parseInt(ua.substring(msie + 5, ua.indexOf('.', msie)), 10);
    }
    var trident = ua.indexOf('Trident/');
    if (trident > 0) {
        // IE 11 => return version number
        var rv = ua.indexOf('rv:');
        return parseInt(ua.substring(rv + 3, ua.indexOf('.', rv)), 10);
    }
    var edge = ua.indexOf('Edge/');
    if (edge > 0) {
        // Edge (IE 12+) => return version number
        return parseInt(ua.substring(edge + 5, ua.indexOf('.', edge)), 10);
    }
    // other browser
    return false;
}

//Add params for JSON
function urlEncode(obj) {
        var s = '';
        for (var key in obj) {
                s += encodeURIComponent(key) + '=' + encodeURIComponent(obj[key]) + '&';
        }
        if (s.length > 0) {
                s = s.substr(0, s.length - 1);
        }
        return (s);
};
//Sort Disc and Track nr
var sort_by = function(field, reverse, primer) {
        var key = primer ? function(x) {
                return primer(x[field])
        } : function(x) {
                return x[field]
        };
        reverse = !reverse ? 1 : -1;
        return function(a, b) {
                return a = key(a), b = key(b), reverse * ((a > b) - (b > a));
        }
};

        var params = {
                id: id,
                country: 'NL',
                entity: 'song',
                limit: 200,
                callback: 'handleTunesSearchTracks'
        };
        var params = urlEncode(params);
        var url = 'https://itunes.apple.com/lookup?' + params;
        var html = '<script src="' + url + '"><\/script>';
        jQuery('head').append(html);
};
//If tracklist is loaded toggle between visible and invisible 
function toggleDiv() {
        if (document.getElementById("track-results").style.display == "inline") {
                document.getElementById("track-results").style.display = "none";
                return false;
        } else {
                document.getElementById("track-results").style.display = "inline";
                return true;
        }
};
//Make cd and tracknr into 2 digits
function n(n) {
        return n > 9 ? "" + n : "0" + n;
};
//Remove unwanted stuff from title for lookup at imDb (Movies)
function GetCleantitle() {
        return escapeRegExp('[SN:TITLE]', '[SN:CAT]');
};
//Get year from title
function getyear(string) {
        var year = string.match(/\d{4}/);
        var pos = string.search(year);
        //if date get leftstring
        if (pos > 0) {
                year = '&year=' + year;
        } else {
                year = '';
        }
        return year;
};

//Make first Letter uppercase
function toProperCase(s) {
        return s.toLowerCase().replace(/^(.)|\s(.)/g, function($1) {
                return $1.toUpperCase();
        });
};
//Clean string make a check for date format
function toCleanString(string) {
        //Remove all special characters
        string = string.replace(/\./g, ' ');
        string = string.replace(/\_/g, ' ');
        string = string.replace(/\`/g, '');
        string = string.replace(/\'/g, '');
        string = string.replace(/\-/g, ' ');
        //Check if there is a date format, without ()
        var year = getyear(string);
        var pos = string.search(year);
        //if date get leftstring
        if (pos > 0) {
                var partname = string.substr(0, pos - 1);
                string = partname.replace(/\s+/, ' ');
        }
        //Strip all season related stuff
        string = regexstr(string);
        //Get proper case
        string = toProperCase(string);
        //Remove HTML entity tags like #123;
        //string = html_entity_decode(string);
        string = htmlDecode(string);
        //Some cases a \s{2} is left, so remove it.
        string = string.replace(/\s+/g, ' ');
        //Give result back
        if (pos > 0) {
                return string = string.replace(/^\s+|\s+$/g, '') + ' (' + year + ')';
        } else {
                return string = string.replace(/^\s+|\s+$/g, '');
        };
};
//Locate year as (2012), remove everything behind. return string
function escapeRegExp(string, cat) {
        if (cat == 'Films') {
                var year = getyear(string);
                //Find pos of year
                var pos = string.search(year);
                if (pos > 0) {
                        //get part before year
                        var partname = string.substr(0, pos - 1);
                        //remove multiple spaces and replace it by 1, add year behind it.
                        partname = partname.replace(/\s+/, ' ');
                        partname = toCleanString(partname) + ' ' + year;
                        partname = partname.replace(/\s+/g, ' ');
                        return partname;
                } else {
                        string = toCleanString(string);
                        return string;
                }
        } else if (cat == 'Series') {
                return toCleanString(string);
        } else if (cat == 'Muziek') {
                string = allmusic(string);
                return string;
        } else {
                return string;
        }
};
//Build YouTubeLink
function SetYouTube() {
        var strURL = "link:http://www.youtube.com/results?search_query=" + GetCleantitle() + ' trailer';
        var re = new RegExp("\\s+", 'g'); // \s means white space (the extra \ is an escape), g means global
        return strURL.replace(re, "%20");
};
//http://www.allmusic.com/search/all/labour%20of%20love%20ub40
function allmusic(string) {
        var strTemp = string.replace(/(\(.*\))?((box)?\s?\d*\s?cd\'?s?\s?\d*)?(\[.*\]\s?)?(\bMP3\b)?(\d{4}.*)?(\'?\*?\#?)?(\d*\s*\-*bits?)?(\d*\s*\-*kbps)?(\d*\s*\-*\.*\d*khz)*(@\d*)?(\{.*\}\s?)?(\s?deel\s?\d{1,2})?(?:flac|stereo|deel|week|eac|ogg|wav\s|wave\)|lossless|dts|HD tracks)?/ig, '');
        //strTemp = html_entity_decode(strTemp);
        strTemp = htmlDecode(strTemp);
        strTemp = strTemp.replace(/\-\s+s/g, '');
        strTemp = strTemp.replace(/^\s+|\s+$/g, '');
        strTemp = strTemp.replace(/^\-+|\-+$/g, '');
        strTemp = strTemp.replace(/&39;/g, '\'');
        return strTemp;
};
//Build IMDbLink
function Setimdb() {
        var re = new RegExp("\\s+", 'g'); // \s means white space (the extra \ is an escape), g means global
        var clean = GetCleantitle();
        var urltitle = clean;
        var pos = clean.search(clean.match(/\(\s*\d{4}\s*\)(?!p)|\s\d{4}\s/));
        if (pos > 0) {
                var partname = clean.substr(0, pos - 1);
                partname = toCleanString(partname).replace(/^\s+|\s+$/g, '');
                urltitle = partname + '&y=' + clean.match(/\d{4}/);
        } else {
                urltitle = clean;
        };
        return urltitle + "&y=&plot=full&r=json";
};
//regex for movie
function regexstr(string) {
        return string.replace(/(\#?\*?\(?\{?\[?(19\d{2})\]?\}?\)?\*?.*)?(\*?\(?\{?\[?(20\d{2})\]?\}?\)?\*?\#?.*)?(\*?\(?\{?\[?\s?S\d{1,2}\s?e\d{1,2}\s?\]?\}?\)?\*?.*)?(deel\s*\d{1,2}?.*)?(\s*\[.*\]\s*)?(\s*\{.*\}\s*)?(seiz.*\s?\d{1,2}?.*)?((\(?\s?\d{3,4}[pmi]).*)?([a-zAZ]*verzoek[a-zAZ]*\s*)?(\(basp\)\s*)?(\(bbc\)\s*)?(\(itv\)\s*)?(\d{1,2}x\d{1,2})?(\(?\s?NL\s?\-?SUBS?\s?\)?)?(\(?\d{1,2}\-?\s?\.?\/?\d{1,2}\-?\s?\.?\/?\d{2,4}\)?.*)?(\bDVD\b.*)?(E\d{1,2}\s?.*)?(\#\s?)?(\d{3,4}\s?bluray.*)?(\bweb\b.*)?(\bdtv\b.*)?/ig, '');
};
//JSON Reader
(function(window, undefined) {
        var JSONP = function(url, method, callback) {
                url = url || '';
                method = method || '';
                callback = callback || function() {};
                if (typeof method == 'function') {
                        callback = method;
                        method = 'callback';
                }
                var generatedFunction = 'jsonp' + Math.round(Math.random() * 1000001)
                window[generatedFunction] = function(json) {
                        callback(json);
                };
                if (url.indexOf('?') === -1) {
                        url = url + '?';
                } else {
                        url = url + '&';
                }
                var jsonpScript = document.createElement('script');
                jsonpScript.setAttribute("src", url + method + '=' + generatedFunction);
                document.getElementsByTagName("head")[0].appendChild(jsonpScript)
        }
        window.JSONP = JSONP;
})(window);
