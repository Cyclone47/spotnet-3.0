<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#131a2a" stroke="rgba(255,255,255,0.06)" stroke-width="4" />
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="url(#grad)" />
    <!-- Usenet Globe / Satellite Waves -->
    <path d="M256 116 A140 140 0 0 0 256 396 A140 140 0 0 0 256 116" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.3" />
    <ellipse cx="256" cy="256" rx="60" ry="140" fill="none" stroke="#ffffff" stroke-width="12" />
    <line x1="116" y1="256" x2="396" y2="256" stroke="#ffffff" stroke-width="12" />
    <circle cx="256" cy="256" r="28" fill="#ffffff" />
  </g>
